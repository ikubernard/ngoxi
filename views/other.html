<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NgoXi Others</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            overflow: hidden;

            font-family:
                Inter,
                Arial,
                sans-serif;

            color: #1e293b;

            background:
                radial-gradient(circle at 15% 18%,
                    rgba(143, 211, 255, .22),
                    transparent 26%),
                radial-gradient(circle at 82% 18%,
                    rgba(208, 175, 255, .20),
                    transparent 30%),
                radial-gradient(circle at 62% 83%,
                    rgba(120, 240, 201, .16),
                    transparent 28%),
                linear-gradient(145deg,
                    #f5f8ff,
                    #f9f5ff 46%,
                    #f2fffb);
        }


        /* =========================
       BACK
    ========================= */

        .back-btn {
            position: fixed;

            top: 25px;
            left: 28px;

            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(42, 61, 82, .09);
            border-radius: 50%;

            background: rgba(255, 255, 255, .72);

            backdrop-filter: blur(14px);

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(64, 78, 104, .08);

            transition: .25s ease;

            z-index: 20;
        }

        .back-btn:hover {
            transform: translateX(-4px) scale(1.03);
            background: #fff;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;

            fill: none;
            stroke: #44546a;

            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================
       MAIN CARD
    ========================= */

        .soon-card {
            position: relative;

            width: min(760px, calc(100% - 35px));

            padding:
                62px 55px 52px;

            overflow: hidden;

            text-align: center;

            border:
                1px solid rgba(255, 255, 255, .75);

            border-radius: 32px;

            background:
                rgba(255, 255, 255, .58);

            backdrop-filter:
                blur(24px) saturate(130%);

            box-shadow:
                0 30px 70px rgba(73, 84, 122, .13);
        }


        /* =========================
       FLOATING LAB ICON
    ========================= */

        .lab {
            position: relative;

            width: 140px;
            height: 140px;

            margin:
                0 auto 30px;
        }

        .lab-core {
            position: absolute;
            inset: 20px;

            display: grid;
            place-items: center;

            border-radius: 34px;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #eaf7ff);

            box-shadow:
                0 16px 35px rgba(85, 119, 150, .16);

            animation:
                labFloat 4s ease-in-out infinite;
        }

        .lab-core svg {
            width: 55px;
            height: 55px;

            fill: none;
            stroke: #557da0;

            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes labFloat {

            0%,
            100% {
                transform:
                    translateY(0) rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-10px) rotate(2deg);
            }
        }


        /* orbital dots */

        .orbit {
            position: absolute;
            inset: 0;

            border:
                1px dashed rgba(92, 118, 150, .16);

            border-radius: 50%;

            animation:
                orbitSpin 13s linear infinite;
        }

        .orbit::before,
        .orbit::after {
            content: "";

            position: absolute;

            width: 13px;
            height: 13px;

            border-radius: 50%;
        }

        .orbit::before {
            top: 4px;
            left: 50%;

            background: #89bfff;

            box-shadow:
                0 0 20px rgba(137, 191, 255, .6);
        }

        .orbit::after {
            bottom: 12px;
            right: 13px;

            background: #bd9cff;

            box-shadow:
                0 0 20px rgba(189, 156, 255, .55);
        }

        @keyframes orbitSpin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================
       TEXT
    ========================= */

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 13px;

            padding:
                7px 11px;

            border:
                1px solid rgba(109, 137, 168, .10);

            border-radius: 999px;

            background:
                rgba(255, 255, 255, .54);

            color: #71839a;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1.5px;
        }

        .eyebrow-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #78a9d8;

            animation:
                blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            50% {
                transform: scale(1.35);
                opacity: .45;
            }
        }


        h1 {
            margin: 0;

            font-size:
                clamp(32px,
                    5vw,
                    52px);

            line-height: .98;

            font-weight: 900;

            letter-spacing: -2px;

            color: #293b50;
        }


        p {
            max-width: 520px;

            margin:
                16px auto 0;

            color: #718093;

            font-size: 14px;
            line-height: 1.65;

            font-weight: 550;
        }


        /* =========================
       MINI STATUS ITEMS
    ========================= */

        .build-status {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 9px;

            margin-top: 25px;
        }

        .build-status span {
            padding:
                8px 12px;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, .52);

            border:
                1px solid rgba(111, 139, 165, .08);

            color: #667b91;

            font-size: 10px;
            font-weight: 800;

            animation:
                statusFloat 3.5s ease-in-out infinite;
        }

        .build-status span:nth-child(2) {
            animation-delay: .5s;
        }

        .build-status span:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes statusFloat {
            50% {
                transform: translateY(-4px);
            }
        }


        /* =========================
       PROGRESS
    ========================= */

        .progress-wrap {
            max-width: 380px;

            margin:
                30px auto 0;

            text-align: left;
        }

        .progress-head {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #8492a2;

            font-size: 10px;
            font-weight: 700;
        }

        .progress {
            width: 100%;
            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(99, 125, 153, .09);
        }

        .progress-fill {
            width: 68%;
            height: 100%;

            border-radius: 999px;

            background:
                linear-gradient(90deg,
                    #75aee0,
                    #9b9ee2,
                    #c6a5dd);

            animation:
                progressGlow 3s ease-in-out infinite;
        }

        @keyframes progressGlow {
            50% {
                filter:
                    brightness(1.12) saturate(1.2);
            }
        }


        /* =========================
       BACK CTA
    ========================= */

        .return-btn {
            margin-top: 30px;

            padding:
                12px 19px;

            border: 0;

            border-radius: 999px;

            background: #293d53;

            color: #fff;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(41, 61, 83, .15);

            transition: .22s ease;
        }

        .return-btn:hover {
            transform: translateY(-2px);
            background: #213449;
        }


        /* =========================
       BACKGROUND PARTICLES
    ========================= */

        .particle {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(.2px);

            animation:
                particleFloat 8s ease-in-out infinite;
        }

        .p1 {
            width: 18px;
            height: 18px;

            left: 9%;
            bottom: 18%;

            background:
                rgba(123, 190, 234, .22);
        }

        .p2 {
            width: 11px;
            height: 11px;

            right: 14%;
            top: 22%;

            background:
                rgba(190, 153, 235, .23);

            animation-delay: 2s;
        }

        .p3 {
            width: 25px;
            height: 25px;

            right: 8%;
            bottom: 15%;

            background:
                rgba(125, 222, 191, .17);

            animation-delay: 1s;
        }

        @keyframes particleFloat {
            50% {
                transform:
                    translateY(-18px) translateX(6px);
            }
        }


        /* =========================
       MOBILE
    ========================= */

        @media(max-width:600px) {

            .back-btn {
                top: 16px;
                left: 16px;

                width: 40px;
                height: 40px;
            }

            .soon-card {
                padding:
                    50px 24px 38px;

                border-radius: 26px;
            }

            .lab {
                width: 115px;
                height: 115px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

    <button id="backBtn" class="back-btn" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" />
        </svg>
    </button>


    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>


    <main class="soon-card">

        <div class="lab">

            <div class="orbit"></div>

            <div class="lab-core">

                <svg viewBox="0 0 24 24">

                    <path d="M9 3h6" />

                    <path d="M10 3v5l-5 9a3 3 0 002.6 4.5h8.8A3 3 0 0019 17l-5-9V3" />

                    <path d="M8 15h8" />

                </svg>

            </div>

        </div>


        <div class="eyebrow">

            <span class="eyebrow-dot"></span>

            NGOXI LAB

        </div>


        <h1>
            Something new is cooking.
        </h1>


        <p>
            Hii sehemu bado tunaiunda. Tunajaribu ideas mpya, experiences mpya
            na vitu ambavyo havitoshei kwenye modes zingine.
        </p>


        <div class="build-status">

            <span>New ideas</span>

            <span>Experimental</span>

            <span>Coming soon</span>

        </div>


        <div class="progress-wrap">

            <div class="progress-head">

                <span>Development</span>

                <span>In progress</span>

            </div>

            <div class="progress">

                <div class="progress-fill"></div>

            </div>

        </div>


        <button id="returnBtn" class="return-btn" type="button">
            Back to NgoXi
        </button>

    </main>


    <script>

        function goBack() {

            if (history.length > 1) {

                history.back();

            } else {

                location.href = "/views/home.html";

            }

        }


        document
            .getElementById("backBtn")
            .addEventListener(
                "click",
                goBack
            );


        document
            .getElementById("returnBtn")
            .addEventListener(
                "click",
                goBack
            );

    </script>

</body>

</html>
