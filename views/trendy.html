<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NgoXi Trendy</title>

    <link rel="stylesheet" href="/assets/trendy/trendy.css">

</head>


<body>


    <header class="trendy-header">

        <button id="backBtn" class="back-btn">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                <path d="M15 18l-6-6 6-6" />

            </svg>

        </button>
        <div class="trendy-search">

            <svg class="search-icon" viewBox="0 0 24 24">

                <path d="M10 2a8 8 0 105.3 14l5 5 1.4-1.4-5-5A8 8 0 0010 2z" />

            </svg>


            <input type="text" placeholder="Search Trendy products">


        </div>


    </header>



    <section class="trendy-categories">


        <button class="active">
            Recommended
        </button>

        <button>
            New Arrivals
        </button>

        <button>
            Fashion
        </button>

        <button>
            Electronics
        </button>

        <button>
            Beauty
        </button>

        <button>
            Shoes
        </button>


    </section>




    <main>

        <div id="trendyGrid" class="product-grid">


        </div>


    </main>




    <script src="/assets/trendy/trendy.js"></script>


</body>

</html>
