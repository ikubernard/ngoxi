<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NgoXi Mamba</title>

    <link rel="stylesheet" href="../assets/mamba/mamba.css">

</head>


<body>


    <!-- INTRO -->

    <div id="mambaIntro">

        <img src="../assets/mamba/icons/croc-eye.png" class="croc-eye">

    </div>



    <!-- MAIN -->

    <div class="mamba-page">



        <!-- TOP BAR -->

        <header class="mamba-header">
            <button id="backBtn" class="back-btn">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                    <path d="M15 18l-6-6 6-6" />

                </svg>

            </button>

            <div class="mamba-logo">

                <img src="../assets/mamba/icons/mamba.png">

            </div>


            <div class="mamba-search">


                <svg viewBox="0 0 24 24" class="search-svg">

                    <circle cx="11" cy="11" r="7">
                    </circle>


                    <line x1="16.5" y1="16.5" x2="22" y2="22">
                    </line>


                </svg>


                <input placeholder="Search Mamba products">


            </div>







            <button class="camera-search">

                <img src="../assets/mamba/icons/camera-search.png">

            </button>



        </header>





        <!-- BRANDS -->

        <section class="brand-section">


            <h2>BRANDS</h2>

            <div class="brand-grid">

                <div class="brand-item">
                    <img src="../assets/mamba/brands/nike.png" alt="Nike">
                    <span>Nike</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/apple.png" alt="Apple">
                    <span>Apple</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/samsung.png" alt="Samsung">
                    <span>Samsung</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/sony.png" alt="Sony">
                    <span>Sony</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/rolex.png" alt="Rolex">
                    <span>Rolex</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/adidas.png" alt="Adidas">
                    <span>Adidas</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/dyson.png" alt="Dyson">
                    <span>Dyson</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/gucci.png" alt="Gucci">
                    <span>Gucci</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/canon.png" alt="Canon">
                    <span>Canon</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/puma.png" alt="Puma">
                    <span>Puma</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/huawei.png" alt="Huawei">
                    <span>Huawei</span>
                </div>

                <div class="brand-item">
                    <img src="../assets/mamba/brands/local-premium.png" alt="Local Premium">
                    <span>Local Premium</span>
                </div>

            </div>


        </section>





        <!-- CATEGORY BAR -->

        <section class="mamba-category">

            <div class="category active" data-filter="recommended">
                Recommended
            </div>

            <div class="category" data-filter="new">
                New Arrivals
            </div>

            <div class="category" data-filter="top">
                Top Products
            </div>

            <div class="category" data-filter="best-selling">
                Best Selling
            </div>

            <div class="category" data-filter="stores">
                Top Stores
            </div>

            <div class="category" data-filter="limited">
                Limited
            </div>

        </section>

        <!-- RECOMMENDED PRODUCT FEED -->

        <section class="product-section">

            <div id="mambaProductGrid" class="product-grid">

            </div>

        </section>
    </div>

    <script src="../assets/mamba/mamba.js"></script>

</body>

</html>
