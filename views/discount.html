<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NgoXi Discount</title>

    <link rel="stylesheet" href="/assets/discount/discount.css">

</head>


<body>


    <header class="discount-top">


        <div class="brand">
            NgoXi
            <span>Deals</span>
        </div>


        <div class="search-box">

            <input id="discountSearch" placeholder="Search discount products...">

        </div>


    </header>





    <section class="deal-highlight">


        <div class="deal-title">

            ⚡ Deals Ending Soon

        </div>


        <div class="timer">

            02 : 45 : 10

        </div>


    </section>





    <section class="deal-options">


        <div>
            🔥
            <br>
            50% OFF
        </div>


        <div>
            ⚡
            <br>
            Flash Deals
        </div>


        <div>
            💰
            <br>
            Best Savings
        </div>


    </section>





    <nav class="categories">


        <button class="active" data-category="all">

            Recommended

        </button>


        <button data-category="fashion">

            Fashion

        </button>


        <button data-category="electronics">

            Electronics

        </button>


        <button data-category="beauty">

            Beauty

        </button>


        <button data-category="home">

            Home

        </button>


        <button data-category="shoes">

            Shoes

        </button>


    </nav>





    <main>


        <div id="discountGrid" class="discount-grid">

        </div>


    </main>





    <script src="/assets/discount/discount.js"></script>

</body>

</html>
