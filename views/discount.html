<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NgoXi Discount</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/assets/discount/discount.css">
</head>

<body>

    <header class="discount-header">
        <button id="backBtn" class="back-btn">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                <path d="M15 18l-6-6 6-6" />

            </svg>

        </button>
        <div class="discount-brand">
            <span class="brand-main">NgoXi</span>
            <span class="brand-deals">Deals</span>
        </div>

        <div class="discount-search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M20 20l-4.2-4.2"></path>
            </svg>

            <input id="discountSearch" type="search" placeholder="Search discount products...">
        </div>
    </header>


    <main class="discount-page">

        <section class="ending-card">
            <div class="ending-title">
                <span class="lightning">⚡</span>
                <span>Deals Ending Soon</span>
            </div>

            <div id="discountTimer" class="ending-timer">
                02 : 45 : 10
            </div>
        </section>


        <section class="hero-wrap">

            <button id="heroPrev" class="hero-arrow hero-arrow-left" type="button" aria-label="Previous slide">
                ‹
            </button>


            <div class="hero-window">

                <div id="discountSlides" class="hero-track">

                    <!-- SLIDE 1 -->
                    <article class="hero-slide hero-orange">

                        <div class="hero-copy">
                            <div class="hero-title-row">
                                <span class="hero-fire">🔥</span>
                                <h1>50% OFF</h1>
                            </div>

                            <h2>Bei za fasta fasta ⚡</h2>
                            <p>Ukichelewa, deal imeenda.</p>
                        </div>

                        <div class="hero-art">
                            <img src="/assets/discount/hero-products.png" class="hero-products" alt="">
                        </div>

                    </article>
                    <!-- SLIDE 2 -->
                    <article class="hero-slide hero-gold">

                        <div class="hero-copy">

                            <div class="hero-title-row">
                                <span class="hero-fire">⚡</span>
                                <h1>FLASH DEALS</h1>
                            </div>

                            <h2>Bei imeshuka balaa 🔥</h2>

                            <p>Usipitwe, chukua yako mapema</p>

                        </div>

                        <div class="hero-art">
                            <img src="/assets/discount/hero-flash.png" class="hero-products" alt="Flash Deals">
                        </div>

                    </article>

                    <!-- SLIDE 3 -->
                    <article class="hero-slide hero-saving">

                        <div class="hero-copy">

                            <div class="hero-title-row">
                                <span class="hero-fire">💎</span>
                                <h1>BEST SAVINGS</h1>
                            </div>

                            <h2>Beauty & Home Collection</h2>

                            <p>Upgrade your lifestyle bila kuumiza mfuko.</p>

                        </div>

                        <div class="hero-art">

                            <img src="/assets/discount/hero-saving.png" class="hero-products" alt="Best Saving">

                        </div>

                    </article>
                </div>

            </div>


            <button id="heroNext" class="hero-arrow hero-arrow-right" type="button" aria-label="Next slide">
                ›
            </button>


            <div id="heroDots" class="hero-dots">
                <button class="hero-dot active" data-slide="0"></button>
                <button class="hero-dot" data-slide="1"></button>
                <button class="hero-dot" data-slide="2"></button>
            </div>

        </section>


        <nav class="discount-categories">

            <button class="discount-category active" data-category="all">
                Recommended
            </button>

            <button class="discount-category" data-category="fashion">
                Fashion
            </button>

            <button class="discount-category" data-category="electronics">
                Electronics
            </button>

            <button class="discount-category" data-category="beauty">
                Beauty
            </button>

            <button class="discount-category" data-category="home">
                Home
            </button>

            <button class="discount-category" data-category="shoes">
                Shoes
            </button>

        </nav>


        <section id="discountGrid" class="discount-grid"></section>

    </main>


    <script src="/assets/discount/discount.js"></script>

</body>

</html>
